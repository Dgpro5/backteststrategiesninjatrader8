name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag della release da pubblicare (es. v1.0.0). Vuoto = solo build e verifica"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Crea NT8BacktestAnalyzer.exe
        run: python -m PyInstaller --noconfirm --clean NT8BacktestAnalyzer.spec

      # Plugin grafico nativo di Windows: con "offscreen" Qt su Windows non trova i font di sistema.
      - name: Verifica che l'exe si avvii, disegni tutte le schede e crei i PDF di stampa (tema chiaro e scuro)
        shell: pwsh
        run: |
          $files = Get-ChildItem examples\*.csv | ForEach-Object { '"' + $_.FullName + '"' }
          foreach ($tema in @("chiaro", "scuro")) {
            $shots = Join-Path $env:RUNNER_TEMP "screenshots\$tema"
            $argList = @("--tema", $tema, "--screenshots", ('"' + $shots + '"')) + $files
            $p = Start-Process -FilePath "dist\NT8BacktestAnalyzer.exe" -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "L'exe (tema $tema) e' terminato con codice $($p.ExitCode)" }
            $png = Get-ChildItem $shots -Filter *.png
            if ($png.Count -ne 5) { throw "Tema ${tema}: attesi 5 screenshot, trovati $($png.Count)" }
            $pdf = Get-ChildItem (Join-Path $shots "stampa") -Filter *.pdf
            if ($pdf.Count -ne 5) { throw "Tema ${tema}: attesi 5 PDF di stampa, trovati $($pdf.Count)" }
            $png + $pdf | Format-Table Name, Length
          }
          Get-Item dist\NT8BacktestAnalyzer.exe | Format-Table Name, Length

      - name: Carica l'exe come artifact
        uses: actions/upload-artifact@v4
        with:
          name: NT8BacktestAnalyzer-windows
          path: |
            dist/NT8BacktestAnalyzer.exe
            examples/*.csv

      - name: Carica gli screenshot di verifica
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}/screenshots

      # Release:
      # - push sul branch principale: automatica se la versione in nt8analyzer/__init__.py non ha ancora una release;
      # - tag v* inviato al repository;
      # - "Run workflow" a mano indicando "release_tag".
      # Nelle pull request lo stesso controllo gira senza pubblicare (mostra cosa succederà dopo il merge).
      - name: Prepara la release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false  # "gh release view" esce con 1 se la release non esiste
          $tag = ""
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG
          } elseif ($env:GITHUB_EVENT_NAME -in @("push", "pull_request")) {
            $version = (Select-String -Path nt8analyzer\__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
            $tag = "v$version"
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "La release $tag esiste gia': niente da pubblicare"
              $tag = ""
            }
          }
          if (-not $tag) {
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "Tag non valido: $tag (atteso vX.Y.Z)" }
          Compress-Archive -Path examples\*.csv -DestinationPath dist\esempi-csv.zip -Force
          $notes = "docs/release-notes/$tag.md"
          if (Test-Path $notes) { Copy-Item $notes release-notes.md }
          else { Set-Content release-notes.md "NT8 Backtest Analyzer $tag per Windows: scarica NT8BacktestAnalyzer.exe e avvialo con un doppio clic." }
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            Write-Host "Pull request: dopo il merge sul branch principale verra' pubblicata la release $tag"
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "Pubblico la release $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=true" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Pubblica la release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NT8 Backtest Analyzer ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          make_latest: true
          files: |
            dist/NT8BacktestAnalyzer.exe
            dist/esempi-csv.zip
